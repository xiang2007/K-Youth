<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- PDF.js: extracts text from uploaded PDFs in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    #chat-history {
      height: 65vh;
      overflow-y: auto;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: .375rem;
      padding: 1rem;
    }

    .msg           { margin-bottom: .75rem; }
    .msg.user      { text-align: right; }

    .bubble {
      display: inline-block;
      padding: .5rem .9rem;
      border-radius: 1rem;
      max-width: 75%;
      word-wrap: break-word;
      text-align: left;
    }

    .user      .bubble { background: #0d6efd; color: #fff; border-bottom-right-radius: .2rem; }
    .assistant .bubble { background: #e9ecef; color: #212529; border-bottom-left-radius: .2rem; }
  </style>
</head>
<body class="bg-light">

<div class="container py-4" style="max-width: 700px;">
  <h5 class="fw-semibold mb-3">💬 Chat</h5>

  <!-- Scrollable chat history -->
  <div id="chat-history"></div>

  <!-- Input area -->
  <div class="mt-3">

    <!-- PDF upload -->
    <div class="mb-2 d-flex align-items-center gap-2">
      <label class="btn btn-sm btn-outline-secondary mb-0">
        📎 Attach PDF
        <input type="file" id="pdf-input" accept=".pdf" hidden>
      </label>
      <span id="pdf-status" class="text-muted" style="font-size:.85rem;">No file chosen</span>
    </div>

    <!-- Text box + send button -->
    <div class="input-group">
      <textarea id="user-input" class="form-control" rows="2"
                placeholder="Type your message… (Enter to send, Shift+Enter for new line)"></textarea>
      <button id="send-btn" class="btn btn-primary px-4">Send</button>
    </div>

  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const historyEl = document.getElementById('chat-history');
  const inputEl   = document.getElementById('user-input');
  const sendBtn   = document.getElementById('send-btn');
  const pdfInput  = document.getElementById('pdf-input');
  const pdfStatus = document.getElementById('pdf-status');

  let pdfText = '';

  // Extract text as soon as a PDF is chosen
  pdfInput.addEventListener('change', async () => {
    const file = pdfInput.files[0];
    if (!file) return;

    pdfStatus.textContent = `Reading "${file.name}"…`;
    try {
      const buffer = await file.arrayBuffer();
      const pdf    = await pdfjsLib.getDocument({ data: buffer }).promise;

      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page    = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n';
      }

      pdfText = text.trim();
      pdfStatus.textContent = `✔ "${file.name}" — ${pdfText.length} characters`;
    } catch (err) {
      pdfStatus.textContent = '⚠ Could not read PDF';
      console.error(err);
    }
  });

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `<span class="bubble">${escHtml(text)}</span>`;
    historyEl.appendChild(div);
    historyEl.scrollTop = historyEl.scrollHeight;
  }

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  async function send() {
    const message = inputEl.value.trim();
    if (!message) return;

    addMessage('user', message);
    inputEl.value       = '';
    sendBtn.disabled    = true;
    sendBtn.textContent = '…';

    const body = { message };
    if (pdfText) body.pdf_text = pdfText;

    try {
      // Relative URL — no hardcoded address needed since FastAPI serves this page
      const res  = await fetch('/chat', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body),
      });
      const data = await res.json();
      addMessage('assistant', data.reply ?? '(no reply)');
    } catch {
      addMessage('assistant', '⚠ Could not reach the backend.');
    }

    sendBtn.disabled    = false;
    sendBtn.textContent = 'Send';

    // Clear PDF after sending
    pdfText             = '';
    pdfInput.value      = '';
    pdfStatus.textContent = 'No file chosen';
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
</script>

</body>
</html>
